name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 min of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Sending warm-up ping to Royal Wedding API..."
          curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://royal-wedding-api-6uim.onrender.com/api/health
          echo "Warm-up ping completed successfully."
